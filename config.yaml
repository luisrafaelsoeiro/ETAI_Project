# ETAI 2026/27 -- Customer repurchase & spend prediction
# Every rule and choice of the pipeline, in the order the pipeline uses them. Fitted values
# (medians, category means, scales) are never stored here: they are learned again from the
# training rows of every split. The evidence for each choice is in notebooks/ (section numbers
# refer to notebooks/01_preprocessing.ipynb unless stated otherwise).

# ---------------------------------------------------------------------------------------------
# 1. DATA
# ---------------------------------------------------------------------------------------------
data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  clientes_path: data/raw/clientes.csv
  sample_submission_path: data/raw/sample_submission.csv
  id_column: id
  submission_id_column: ID          # the id column's name in test.csv / sample_submission.csv
  group_column: customer_id
  date_column: purchase_date
  target_columns: [repeat_purchase_90d, spend_next_90d]
  # kept row-aligned beside X (split, grouping, submission), never model inputs
  extras_columns: [id, customer_id, purchase_date]
  # random_noise: pure noise (corr with target -0.012), section 5.1
  drop_columns: [random_noise]

# ---------------------------------------------------------------------------------------------
# 2. VALIDATION of every purchase table (train.csv, test.csv, new records) before cleaning
#    (`validate_schema`, first step of `prepare_table`; section 2.10)
# ---------------------------------------------------------------------------------------------
schema:
  required_columns: [id, customer_id, purchase_date, total_payable, gross_total, net_total,
                     total_tax, shipping_cost, global_discount_total, line_discount_total, cost,
                     line_item_count, invoice_count_current_purchase,
                     days_since_previous_purchase, customer_tenure_days, prior_purchase_count,
                     prior_total_spend, prior_mean_purchase_value, prior_std_purchase_value,
                     prior_min_purchase_value, prior_max_purchase_value, prior_mean_gap_days,
                     prior_std_gap_days, purchase_count_30d, spend_30d, purchase_count_90d,
                     spend_90d, purchase_count_180d, spend_180d, purchase_count_365d, spend_365d,
                     payment_type, salesperson, commercial_zone, transport_method, warehouse,
                     document_series]
  # targets only exist in train.csv; random_noise is dropped anyway
  optional_columns: [repeat_purchase_90d, spend_next_90d, random_noise]
  expected_types:
    numeric: [id, customer_id, total_payable, gross_total, net_total, total_tax, shipping_cost,
              global_discount_total, line_discount_total, cost, line_item_count,
              invoice_count_current_purchase, days_since_previous_purchase,
              customer_tenure_days, prior_purchase_count, prior_total_spend,
              prior_mean_purchase_value, prior_std_purchase_value, prior_min_purchase_value,
              prior_max_purchase_value, prior_mean_gap_days, prior_std_gap_days,
              purchase_count_30d, spend_30d, purchase_count_90d, spend_90d,
              purchase_count_180d, spend_180d, purchase_count_365d, spend_365d,
              repeat_purchase_90d, spend_next_90d, random_noise]
    integer: [id, customer_id, line_item_count, invoice_count_current_purchase,
              customer_tenure_days, prior_purchase_count, purchase_count_30d,
              purchase_count_90d, purchase_count_180d, purchase_count_365d,
              repeat_purchase_90d]
    date: [purchase_date]
  # every diagnostics.non_negative_columns entry also gets min 0 automatically
  ranges:
    # a purchase can't be in the future (`today` is resolved when the check runs)
    purchase_date: {min: "2010-01-01", max: today}
    line_item_count: {min: 1}
    invoice_count_current_purchase: {min: 1}
    repeat_purchase_90d: {min: 0, max: 1}
    spend_next_90d: {min: 0}
  # every label follows "<fixed text> <number>"; a label that doesn't is not a category
  allowed_categories:
    payment_type: 'Maybe Tomorrow Payment \d+'
    salesperson: 'VLOOKUP Master \d+'
    commercial_zone: 'Decorative Dashboard Zone \d+'
    transport_method: 'Maybe Tomorrow Delivery \d+'
    warehouse: 'Final Excel Warehouse \d+'
    document_series: 'Ctrl Z Series \d+'

# ---------------------------------------------------------------------------------------------
# 3. CLEANING RULES -- stateless, row-preserving (`clean_dataset`; sections 2 and 5)
# ---------------------------------------------------------------------------------------------
diagnostics:
  date_column: purchase_date
  column_renames:
    "Total a Pagar": total_payable
    "Total Bruto": gross_total
    "Total Liquido": net_total
    "Total Imp_": total_tax
    "Total Portes": shipping_cost
    "Total Desc_ Global": global_discount_total
    "Total Desc_ Linha": line_discount_total
    "Custo": cost
    "N_ Detalhes": line_item_count

  # text placeholders -> NaN when the file is loaded (load_data). In the raw files the only
  # one found is the blank cell (section 2.2)
  placeholder_tokens: ["", "-", "--", "?", "N/A", "NA", "n/a", "na", "null", "NULL", "None",
                       "none", "nan", "NaN", "missing", "Missing", "unknown", "Unknown"]

  # negative amounts, counts and time intervals are impossible -> NaN
  non_negative_columns:
    - total_payable
    - gross_total
    - net_total
    - total_tax
    - shipping_cost
    - global_discount_total
    - line_discount_total
    - cost
    - line_item_count
    - invoice_count_current_purchase
    - days_since_previous_purchase
    - customer_tenure_days
    - prior_purchase_count
    - prior_total_spend
    - prior_mean_purchase_value
    - prior_std_purchase_value
    - prior_min_purchase_value
    - prior_max_purchase_value
    - prior_mean_gap_days
    - prior_std_gap_days
    - purchase_count_30d
    - spend_30d
    - purchase_count_90d
    - spend_90d
    - purchase_count_180d
    - spend_180d
    - purchase_count_365d
    - spend_365d

  # the exact value 1,000,000,000 only appears in these two columns -> placeholder -> NaN
  placeholder_values: [1000000000]
  placeholder_columns: [prior_mean_purchase_value, spend_365d]

  # logical rules between columns of the same row, checked only where every term is
  # observed (section 5.2). `invalidate`: the value is impossible -> NaN (then recovered by
  # recompute_rules where possible). No `invalidate`: report only.
  consistency_rules:
    - {rule: "abs(gross_total - line_discount_total - global_discount_total - net_total) <= 0.05"}
    - {rule: "abs(net_total + total_tax - total_payable) <= 0.05"}   # shipping is not in total_payable
    - {rule: "purchase_count_30d <= purchase_count_90d"}
    - {rule: "purchase_count_90d <= purchase_count_180d"}
    - {rule: "purchase_count_180d <= purchase_count_365d"}
    - {rule: "purchase_count_365d <= prior_purchase_count"}
    - {rule: "spend_30d <= spend_90d + 0.01"}
    - {rule: "spend_90d <= spend_180d + 0.01"}
    - {rule: "spend_180d <= spend_365d + 0.01"}
    - {rule: "prior_min_purchase_value <= prior_max_purchase_value + 0.01"}
    - {rule: "days_since_previous_purchase <= customer_tenure_days + 0.5"}
    - {rule: "line_item_count >= 1"}
    - {rule: "invoice_count_current_purchase >= 1"}
    # 39 train rows sold below cost: plausible -> kept
    - {rule: "cost <= net_total"}
    # last-365-day spend cannot exceed all prior spend: 39 train rows are 1.5-23x too high
    - {rule: "spend_365d <= prior_total_spend + 0.01", invalidate: spend_365d}
    # the prior mean must equal total / count: 46 train rows are 8-25x too high (above the max)
    - rule: "abs(prior_mean_purchase_value - prior_total_spend / prior_purchase_count) <= 0.6 + 0.001 * prior_mean_purchase_value"
      when: "prior_purchase_count > 0"
      invalidate: prior_mean_purchase_value
    # one previous purchase cannot be larger than the sum of all previous purchases
    # (notebooks/02_outlier_detection.ipynb): 45 train rows
    - rule: "prior_max_purchase_value <= prior_total_spend + 0.01"
      when: "prior_purchase_count > 0"
      invalidate: prior_max_purchase_value

  # NaN -> value implied by an identity between columns of the same row
  # (each identity holds for >= 99% of the rows where all terms are observed; section 5.1)
  recompute_rules:
    - column: prior_mean_purchase_value
      expression: "prior_total_spend / prior_purchase_count"
      when: "prior_purchase_count > 0"
    - column: days_since_previous_purchase
      expression: "customer_tenure_days"
      when: "prior_purchase_count == 1"
    - column: days_since_previous_purchase
      expression: "customer_tenure_days - prior_mean_gap_days * (prior_purchase_count - 1)"
      when: "prior_purchase_count >= 2"
    - column: prior_mean_gap_days
      expression: "(customer_tenure_days - days_since_previous_purchase) / (prior_purchase_count - 1)"
      when: "prior_purchase_count >= 2"
    - column: spend_365d
      expression: "prior_total_spend"
      when: "customer_tenure_days <= 365"
    # one previous purchase: it is the minimum, the maximum and the total at once (holds on
    # 100% of the 466 / 469 observed rows); two previous purchases: min + max = total (100% of 387)
    - column: prior_max_purchase_value
      expression: "prior_total_spend"
      when: "prior_purchase_count == 1"
    - column: prior_min_purchase_value
      expression: "prior_total_spend"
      when: "prior_purchase_count == 1"
    - column: prior_max_purchase_value
      expression: "prior_total_spend - prior_min_purchase_value"
      when: "prior_purchase_count == 2"
    - column: prior_min_purchase_value
      expression: "prior_total_spend - prior_max_purchase_value"
      when: "prior_purchase_count == 2"

  # NaN that cannot exist ("not applicable") -> 0, with the flags below marking them (section 5.3)
  structural_fill:
    - when: "prior_purchase_count == 0"      # first purchase: no history at all
      value: 0
      columns: [days_since_previous_purchase, prior_mean_purchase_value,
                prior_min_purchase_value, prior_max_purchase_value]
    - when: "prior_purchase_count < 2"       # a std / a gap needs two purchases
      value: 0
      columns: [prior_std_purchase_value, prior_mean_gap_days]
    - when: "prior_purchase_count < 3"       # a std of gaps needs two gaps
      value: 0
      columns: [prior_std_gap_days]

  flags:
    is_first_purchase: "prior_purchase_count == 0"
    has_gap_history: "prior_purchase_count >= 2"

  # gaps filled from the SAME customer's earlier purchases (`fill_from_customer_history`,
  # notebooks/05_imputation.ipynb). Past purchases only, never a later one and never a target.
  # It runs after `prepare_table`, on every purchase known at prediction time (train.csv +
  # test.csv); what it can't fill is left to the fitted imputers of the pipeline.
  customer_history:
    use: true
    key: customer_id
    date_column: purchase_date
    order_column: prior_purchase_count
    # the customer's last observed value: equals the actual value on 81-99% of purchases
    # (most frequent value: 17-72%, warehouse 99.6% for both)
    last_observed_columns: [payment_type, salesperson, transport_method, warehouse,
                            commercial_zone, document_series]
    # = date difference to the customer's previous purchase when that purchase is in the data
    # (its prior_purchase_count is one lower): 100% of 6,669 observed rows. The recompute
    # rules then run again, so prior_mean_gap_days follows from it
    previous_purchase_gap: days_since_previous_purchase

  # purchase-time features (section 11): only information known at the moment of the
  # purchase -- the date itself, and ratios of columns of the same row. All are computed;
  # each task selects the ones its ablation kept (regression: date parts)
  date_features: [month, weekday]
  derived_features:
    margin: "net_total - cost"
    margin_rate: "(net_total - cost) / net_total"
    discount_rate: "(line_discount_total + global_discount_total) / gross_total"
    avg_line_value: "net_total / line_item_count"
    spend_share_30d: "spend_30d / (spend_365d + 1)"
    spend_share_90d: "spend_90d / (spend_365d + 1)"

  # exact sums of other columns (100% of rows): gross_total = net_total + line + global
  # discounts; total_payable = net_total + total_tax
  redundant_columns: [gross_total, total_payable]

  # training only: rows where everything except these is missing are dropped (section 2.4)
  almost_empty_preserved_columns: [id, customer_id, repeat_purchase_90d]

# Customer table (clientes.csv): master data, one row per customer, prepared by
# src/customers.py -> prepare_customers and joined by add_customer_features. Every step is a rule
# on the static table (no purchase row, no label). Evidence: notebooks/04_customer_table.ipynb
customers:
  use: true
  key: customer_id
  # 1. validation of clientes.csv itself
  schema:
    required_columns: [customer_id, country_or_region, commercial_region, island, municipality, city,
                       postal_area, postal_code, street, address, customer_type, company_name,
                       customer_since_year]
    expected_types:
      numeric: [customer_id, customer_since_year]
      integer: [customer_id, customer_since_year]
    # a registration can't be in the future (`current_year` is resolved when the check runs);
    # the lower limit only rejects absurd years -- a year before 2015 (the first year of the
    # records) is still plausible for an old account. Out of range -> NaN here: the year is
    # impossible, and years_as_customer is then imputed inside the pipeline
    ranges:
      customer_id: {min: 1}
      customer_since_year: {min: 1900, max: current_year}
    out_of_range_to_nan: true
    allowed_categories:
      country_or_region: 'Country CT\d+: .+'
      commercial_region: 'Region RG\d+: .+'
      island: 'Island IS\d+: .+'
      municipality: 'Municipality MU\d+: .+'
      city: 'City CY\d+: .+'
      postal_area: 'Postal area PA\d+: .+'
      postal_code: 'Postal code PC\d+: .+'
      street: 'Street ST\d+: .+'
      address: 'Address AD\d+: .+'
      company_name: '.+ \d+'
  # 3. near-duplicates to report (never merged: different ids are different accounts)
  near_duplicate_columns: [company_name, address]
  # 5. every label is "<prefix> <code>: <filler text>"; one code always has the same label, so
  #    the code alone keeps all the information ("#REF!" in postal codes is filler text, not an error)
  code_pattern: '([A-Z]{2}\d+):'
  code_columns: [country_or_region, commercial_region, island, municipality, city, postal_area,
                 postal_code, street, address]
  # 6. data-quality signal: address fields the record has, counted before any recovery
  profile_columns: [commercial_region, municipality, city, postal_area, postal_code, street]
  # 7. the geography is a strict hierarchy (each municipality / postal area / postal code / island
  #    belongs to one region): checked, then used to recover missing levels exactly
  hierarchy_checks:
    - [commercial_region, country_or_region]
    - [island, commercial_region]
    - [municipality, commercial_region]
    - [postal_area, commercial_region]
    - [postal_code, postal_area]
    - [postal_area, municipality]
    - [city, municipality]
  hierarchy_recovery:
    - {column: commercial_region, from: [postal_area, postal_code, municipality, city]}
    - {column: municipality, from: [postal_code, city]}
  # 8. islands exist only in 2 regions: elsewhere the island is undefined, not missing
  structural_fill:
    island: {parent: commercial_region, value: none}
  # 9. levels with few customers act like customer ids; backing off to the parent level was
  #    tested (municipality < 5 / 10 / 20 customers -> its region) and was NOT better: the target
  #    encoder already shrinks small groups -> off. To switch on, e.g.:
  #    municipality: {min_customers: 10, fallback_column: commercial_region}
  #    country_or_region: {min_customers: 10, fallback: other}
  rare_level_backoff: {}
  # 10. flags: customer_since_year = 2015 is the first year of the records -> "already a
  #     customer when the records start" (664 of 1,143), not a 2015 sign-up
  flags:
    customer_since_before_records: "customer_since_year <= 2015"
  # columns kept from the customer table and joined to every purchase
  columns: [country_or_region, commercial_region, island, municipality, profile_completeness,
            customer_since_before_records, customer_since_year]
  derived_features:
    years_as_customer: "purchase_date.dt.year - customer_since_year"
  # a purchase can't happen before the customer existed
  consistency_rules:
    - {rule: "years_as_customer >= 0", invalidate: years_as_customer}
  drop_after_derive: [customer_since_year]

# Compact storage types applied after the stateless cleaning rules. Monetary values and
# calculated statistics remain float64. days_since_previous_purchase also stays float64
# because an identity can recover a small number of fractional estimates.
dtypes:
  Int8: [repeat_purchase_90d]
  Int16:
    - line_item_count
    - invoice_count_current_purchase
    - customer_tenure_days
    - prior_purchase_count
    - purchase_count_30d
    - purchase_count_90d
    - purchase_count_180d
    - purchase_count_365d
    - purchase_month
    - purchase_weekday
    - years_as_customer
    - profile_completeness
    - customer_since_before_records
  Int32: [id, customer_id]
  category:
    - payment_type
    - salesperson
    - commercial_zone
    - transport_method
    - warehouse
    - document_series
    - country_or_region
    - commercial_region
    - island
    - municipality

# ---------------------------------------------------------------------------------------------
# 4. VALIDATION DESIGN (section 7)
# ---------------------------------------------------------------------------------------------
# locked test set: never used to fit, tune, compare or choose anything
test_set:
  strategy: temporal       # test.csv lies strictly after train.csv in time
  size: 0.2
  gap_days: 90             # dev rows whose 90-day label window reaches into the test period are left out
  random_state: 42         # only used by strategy "stratified"
  evaluate: false          # true ONLY for the final chosen models: scores the locked test set once
  refit_on_all_rows: false # with evaluate: true, refit on development + locked test rows afterwards
                           # (the saved model and the test.csv predictions then use every labelled row)

# cross-validation inside the development set: expanding-window temporal folds
cv:
  n_splits: 5
  gap_days: 90

# ---------------------------------------------------------------------------------------------
# 5. PREPROCESSING RECIPE -- fitted inside the model Pipeline (`build_preprocessor`; section 8)
# ---------------------------------------------------------------------------------------------
preprocessing:
  numeric_features:
    - net_total
    - total_tax
    - shipping_cost
    - global_discount_total
    - line_discount_total
    - cost
    - line_item_count
    - invoice_count_current_purchase
    - days_since_previous_purchase
    - customer_tenure_days
    - prior_purchase_count
    - prior_total_spend
    - prior_mean_purchase_value
    - prior_std_purchase_value
    - prior_min_purchase_value
    - prior_max_purchase_value
    - prior_mean_gap_days
    - prior_std_gap_days
    - purchase_count_30d
    - spend_30d
    - purchase_count_90d
    - spend_90d
    - purchase_count_180d
    - spend_180d
    - purchase_count_365d
    - spend_365d
  categorical_features:
    - payment_type
    - salesperson
    - commercial_zone
    - transport_method
    - warehouse
    - document_series
  flag_features: [is_first_purchase, has_gap_history]
  # columns whose missingness carries information (section 6); the `indicators` step of the
  # pipeline (MissingIndicator) adds a 0/1 column for each: after the identity fill,
  # spend_365d is only missing for customers with > 365 days of tenure
  mnar_indicator_sources: [spend_365d]
  imputation:
    numeric_strategy: median          # median | mean | constant | knn | iterative (section 12)
    # knn only: n_neighbors (default 5) and knn_weights (uniform | distance). KNN is settled:
    # with a tuned forest no k (3/5/10/20) or weighting is decisive (notebooks/05_imputation.ipynb,
    # section 8) -> median
    categorical_strategy: most_frequent
    # the numeric imputer learns these columns only from training rows meeting the condition:
    # on a first purchase their 0 is the structural "no history" (diagnostics.structural_fill),
    # not a value, and would pull the median down (notebooks/05_imputation.ipynb, section 6)
    fit_rows:
      spend_365d: "prior_purchase_count > 0"
      prior_max_purchase_value: "prior_purchase_count > 0"
    # a column with its own estimate from related columns of the same row, applied before the
    # imputer above (which fills whatever it can't). strategy: formula (`expression`) |
    # iterative (`columns`) | group_median (`by`, `bins`, `fit_rows`). Each task sets its own
    column_imputers: {}
    # after imputing, an IMPUTED value is kept within the limits its own row implies
    # (`RowBoundedImputer`; observed values are never changed). Without it the median breaks
    # these rules on 56% of the imputed spend_365d values (notebooks/05_imputation.ipynb)
    row_bounds:
      spend_365d: {min: spend_180d, max: prior_total_spend}
      prior_max_purchase_value:
        min: prior_mean_purchase_value
        max: "prior_total_spend - (prior_purchase_count - 1) * prior_min_purchase_value"
      days_since_previous_purchase: {max: customer_tenure_days}
      prior_mean_gap_days: {max: customer_tenure_days}
  # 0 = off. Grouping categories under N training rows into "rare" was worse for both
  # tasks (section 11): the target encoder already shrinks rare categories
  rare_category_min_count: 0
  # shared default; each task overrides it with the pair its own comparison chose
  encoder: target                     # onehot | ordinal | count | target
  scaler: robust                      # none | standard | minmax | robust
  random_state: 42

# ---------------------------------------------------------------------------------------------
# 6. TASKS -- what differs between the classifier and the regressor
# ---------------------------------------------------------------------------------------------
classification:
  target: repeat_purchase_90d
  metrics: [accuracy, f1, roc_auc]    # reported; options in classification/evaluate.py (SCORING)
  selection_metric: accuracy          # every comparison and the tuning use this one
  # scaling-sensitive model used to compare encoder x scaler pairs (trees ignore scaling)
  comparison_model: {type: logistic_regression, params: {max_iter: 2000}}
  candidate_models:
    - {type: dummy, params: {strategy: most_frequent}}
    - {type: logistic_regression, params: {max_iter: 2000}}
    - {type: decision_tree, params: {max_depth: 5, random_state: 42}}
    - {type: random_forest, params: {n_estimators: 300, min_samples_leaf: 5, n_jobs: -1, random_state: 42}}
  # section 9: target + standard, tied with target + minmax / robust (no pair is decisively
  # better -> keep). Section 11: none of the new features helps -> original features;
  # section 12: median / most frequent
  preprocessing: {encoder: target, scaler: standard}
  # section 10: validation accuracy 0.708, no train/validation gap; the random forest ties it
  # (0.0005 ahead, SE 0.0035, not decisive) and overfits (train 0.85) -> keep
  # (current numbers: notebooks/05_imputation.ipynb, section 9)
  # types: dummy | logistic_regression | decision_tree | random_forest | gradient_boosting |
  #        hist_gradient_boosting | xgboost
  model: {type: logistic_regression, params: {max_iter: 2000}}
  # Optuna + nested temporal CV on the selection metric (`python main.py` runs it when enabled;
  # slow: n_trials x inner_splits fits per outer fold)
  tuning:
    enabled: false
    n_trials: 30
    inner_splits: 3
    random_state: 42
    search_spaces:
      logistic_regression:
        model__C: {type: float, low: 0.0001, high: 100.0, log: true}
        model__class_weight: {type: categorical, choices: [null, balanced]}
      decision_tree:
        model__max_depth: {type: int, low: 2, high: 12}
        model__min_samples_leaf: {type: int, low: 1, high: 100, log: true}
      random_forest:
        model__n_estimators: {type: int, low: 100, high: 500}
        model__max_depth: {type: categorical, choices: [null, 5, 8, 12, 16]}
        model__min_samples_leaf: {type: int, low: 1, high: 50, log: true}
        model__max_features: {type: categorical, choices: [sqrt, log2, 1.0]}
      hist_gradient_boosting:
        model__max_iter: {type: int, low: 50, high: 500, log: true}
        model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
        model__max_leaf_nodes: {type: int, low: 4, high: 64, log: true}
        model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      xgboost:
        model__n_estimators: {type: int, low: 50, high: 600, log: true}
        model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
        model__max_depth: {type: int, low: 1, high: 8}
        model__subsample: {type: float, low: 0.5, high: 1.0}
        model__colsample_bytree: {type: float, low: 0.5, high: 1.0}

regression:
  target: spend_next_90d
  # trained only on repeat purchasers with an observed spend (targets are never imputed)
  row_filter: "repeat_purchase_90d == 1 and spend_next_90d.notna()"
  metrics: [rmse, mae, r2]            # reported; options in regression/evaluate.py (SCORING)
  selection_metric: rmse
  comparison_model: {type: ridge, params: {alpha: 1.0}}
  candidate_models:
    - {type: dummy, params: {strategy: mean}}
    - {type: ridge, params: {alpha: 1.0}}
    - {type: decision_tree, params: {max_depth: 5, random_state: 42}}
    - {type: random_forest, params: {n_estimators: 300, min_samples_leaf: 5, n_jobs: -1, random_state: 42}}
  # section 9: target + minmax ranks first (ordinal + minmax is a tie, and ordinal would
  # impose a meaningless order on unordered categories)
  preprocessing:
    encoder: target
    scaler: minmax
    # section 11: date parts (48 RMSE, 5/5 folds) and customer features (44 RMSE) lower
    # RMSE; the derived ratios add nothing
    # notebooks/04_customer_table.ipynb: + profile completeness and "customer before the records"
    extra_numeric_features: [purchase_month, purchase_weekday, years_as_customer, profile_completeness,
                             customer_since_before_records]
    extra_categorical_features: [country_or_region, commercial_region, island, municipality]
    # section 12: an explicit "Missing" category: the remaining customer gaps are incomplete
    # profiles related to the target; most frequent is now decisively worse (2.4 RMSE,
    # notebooks/05_imputation.ipynb, section 7)
    imputation:
      categorical_strategy: constant
      categorical_fill_value: Missing
      # 365-day spend = 365-day purchase count x mean purchase value: recovers hidden known
      # values 2.9x closer than the median (MAE 1,217 vs 3,478); the row limits move 7% of its
      # values vs 61% of the median's; RMSE better on 4 of 5 folds for 3 of 4 forest seeds,
      # never decisive (notebooks/05_imputation.ipynb, section 6). The classification keeps
      # the median: there it costs 0.0005-0.001 accuracy, better on 0 of 5 folds
      column_imputers:
        spend_365d: {strategy: formula, expression: "purchase_count_365d * prior_mean_purchase_value"}
  # section 10: lowest validation RMSE (1942, notebooks/05_imputation.ipynb, section 9); ahead
  # of ridge on 3 of 5 folds (113 RMSE, SE 74: not decisive). target_transform: none | log1p -- log1p was decisively worse in euros.
  # types: dummy | ridge | decision_tree | random_forest | gradient_boosting |
  #        hist_gradient_boosting | xgboost
  model:
    type: random_forest
    params: {n_estimators: 300, min_samples_leaf: 5, n_jobs: -1, random_state: 42}
    target_transform: none
  tuning:
    enabled: false
    n_trials: 30
    inner_splits: 3
    random_state: 42
    search_spaces:
      ridge:
        model__alpha: {type: float, low: 0.001, high: 100.0, log: true}
      decision_tree:
        model__max_depth: {type: int, low: 2, high: 12}
        model__min_samples_leaf: {type: int, low: 1, high: 100, log: true}
      random_forest:
        model__n_estimators: {type: int, low: 100, high: 500}
        model__max_depth: {type: categorical, choices: [null, 5, 8, 12, 16]}
        model__min_samples_leaf: {type: int, low: 1, high: 50, log: true}
        model__max_features: {type: categorical, choices: [sqrt, log2, 1.0]}
      hist_gradient_boosting:
        model__max_iter: {type: int, low: 50, high: 500, log: true}
        model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
        model__max_leaf_nodes: {type: int, low: 4, high: 64, log: true}
        model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      xgboost:
        model__n_estimators: {type: int, low: 50, high: 600, log: true}
        model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
        model__max_depth: {type: int, low: 1, high: 8}
        model__subsample: {type: float, low: 0.5, high: 1.0}
        model__colsample_bytree: {type: float, low: 0.5, high: 1.0}

# ---------------------------------------------------------------------------------------------
# 7. OUTPUT (generated, git-ignored)
# ---------------------------------------------------------------------------------------------
output:
  results_dir: results                  # one report per run: <task>_<model>_<run>.txt
  scoreboard: results/runs.csv          # one row per run, both tasks
  predictions_dir: results/predictions  # test.csv predictions (classification = Kaggle format)
  models_dir: models                    # fitted pipelines: <task>_pipeline.joblib
